{% extends "header.html" %}
{% load static %}
{% block content %}
{% include "admin-menu.html" %}

<link rel="stylesheet" href="{% static 'css/update_work_request.css' %}">

<div class="update-form-container">
    <h2>Оновити ворк-реквест</h2>

    <form method="post">
        {% csrf_token %}

        <label for="status">Статус:</label>
        <select name="status" id="status">
            {% for status in statuses %}
                <option value="{{ status.id }}" {% if status.id == work_request.id_status_id %}selected{% endif %}>
                    {{ status.status }}
                </option>
            {% endfor %}
        </select>

        <label for="project">Проєкт:</label>
        <select name="project" id="project">
            {% for project in projects %}
                <option value="{{ project.id }}" {% if project.id == work_request.id_project_id %}selected{% endif %}>
                    {{ project.name }}
                </option>
            {% endfor %}
        </select>

        <button type="submit-re">Оновити</button>
    </form>
</div>

{% endblock %}
